<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Radar Circles -->
  <circle cx="256" cy="256" r="180" fill="url(#radarPulse)" stroke="#0d9488" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#14b8a6" stroke-width="3" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="12" fill="#2dd4bf" filter="url(#glow)" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="10 10" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="10 10" />

  <!-- Threat Radar Ping (Red Alert) -->
  <circle cx="340" cy="180" r="18" fill="#ef4444" filter="url(#glow)" />
  <circle cx="340" cy="180" r="32" fill="none" stroke="#ef4444" stroke-width="3" stroke-opacity="0.7">
    <animate attributeName="r" values="18;45" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Mosquito Shield Emblem Outline -->
  <path d="M 256 120 L 330 156 C 330 260 256 340 256 340 C 256 340 182 260 182 156 Z" 
        fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />
</svg>
